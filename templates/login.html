{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-5 shadow-sm border-0">
            <h3 class="text-center fw-bold text-success mb-4">{{ action }}</h3>
            
            <!-- Shows error messages if password is wrong -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-danger text-center">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 fs-5">{{ action }}</button>
            </form>

            <div class="text-center mt-4 text-muted">
                {% if action == 'Login' %}
                    <p>New here? <a href="/register" class="text-success fw-bold text-decoration-none">Create an account</a></p>
                {% else %}
                    <p>Already have an account? <a href="/login" class="text-success fw-bold text-decoration-none">Log in</a></p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
